name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is deliberately absent: see docs/PLANNING.md §9.1 — an
        # unsigned macOS bundle is judged worse than no macOS bundle, so it
        # is post-MVP and not carried in CI until then.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The rig layer is tested against a real rigctld driving hamlib's dummy
      # rig — no radio needed, but the binaries must exist. Where they do not
      # (Windows runners), those tests report as skipped, not failures.
      - name: Install hamlib
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhamlib-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -v
