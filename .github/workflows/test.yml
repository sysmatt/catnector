name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is deliberately absent: see docs/PLANNING.md §9.1 — an
        # unsigned macOS bundle is judged worse than no macOS bundle, so it
        # is post-MVP and not carried in CI until then.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The rig layer is tested against a real rigctld driving hamlib's dummy
      # rig — no radio needed, but the binaries must exist. Where they do not
      # (Windows runners), those tests report as skipped, not failures.
      - name: Install hamlib
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhamlib-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Pulls in the catnector-protocol reference site, which the site-client
      # tests run against. Without it those tests skip rather than fail.
      - name: Sync dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      # uv.lock pins catnector-protocol to a commit. A stale pin installs an
      # old reference site and fails in ways that look like catnector bugs,
      # so say plainly which commit is under test.
      - name: Report the pinned protocol revision
        shell: bash
        run: |
          uv run --no-sync python - <<'EOF'
          from importlib.metadata import version
          from pathlib import Path
          from catnector_protocol import schemas
          count = len(list(schemas.SCHEMA_DIR.glob("*.json")))
          print(f"catnector-protocol {version('catnector-protocol')}")
          print(f"  schemas: {count} in {schemas.SCHEMA_DIR}")
          assert count, "the installed reference site ships no schemas"
          EOF

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Qt runs offscreen (tests/conftest.py sets QT_QPA_PLATFORM), but the
      # Linux runners still need the X libraries PySide6 links against.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Test
        run: uv run pytest -v
