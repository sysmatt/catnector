name: release

# Builds the downloadable artifacts. Runs on tags, and on demand so a build
# can be exercised without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04     # oldest supported glibc wins the most machines
    env:
      HAMLIB_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12

      # Cheap checks first: a missing build tool should cost seconds, not a
      # hamlib compile and a PyInstaller run.
      - name: Verify the packaging toolchain
        run: |
          uv sync --all-groups --python 3.12
          uv run pyinstaller --version

      # Built from source rather than installed from apt. Ubuntu 22.04 ships
      # hamlib 4.3.1, which is below catnector's own supported floor of 4.5
      # (docs/PLANNING.md §8.2) — a bundle made from it fails --check-rig.
      # 22.04 is still the right runner: its glibc 2.35 keeps the AppImage
      # working on Debian 12 and Ubuntu 22.04, which 24.04 would exclude.
      - name: Build hamlib ${{ env.HAMLIB_VERSION }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libusb-1.0-0-dev pkg-config
          curl -fsSL -o hamlib.tar.gz \
            "https://github.com/Hamlib/Hamlib/releases/download/${HAMLIB_VERSION}/hamlib-${HAMLIB_VERSION}.tar.gz"
          tar xf hamlib.tar.gz
          cd "hamlib-${HAMLIB_VERSION}"
          ./configure --prefix=/usr/local --disable-static
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          rigctld --version

      - name: Install Qt runtime libraries
        run: sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libfuse2

      - run: uv run pytest -q

      - name: Build the bundle
        run: uv run pyinstaller packaging/catnector.spec --noconfirm

      # The point of bundling: this must pass with no hamlib on PATH.
      # The point of bundling: this must pass with no hamlib reachable. A
      # build machine that has hamlib installed will happily pass a test that
      # a user's machine fails, so hide it first.
      - name: Verify the bundle ships working rig control
        run: |
          sudo mv /usr/local/bin/rigctl /usr/local/bin/rigctl.hidden
          sudo mv /usr/local/bin/rigctld /usr/local/bin/rigctld.hidden
          QT_QPA_PLATFORM=offscreen dist/catnector/catnector --check-rig
          sudo mv /usr/local/bin/rigctl.hidden /usr/local/bin/rigctl
          sudo mv /usr/local/bin/rigctld.hidden /usr/local/bin/rigctld

      - name: Build the AppImage
        run: ./packaging/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: catnector-linux
          path: dist/*.AppImage

  windows:
    runs-on: windows-latest
    env:
      HAMLIB_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --all-groups --python 3.12
      - name: Verify the packaging toolchain
        run: uv run pyinstaller --version

      # Windows has no hamlib package; take the official build and put it on
      # PATH so the spec's collector finds it exactly as it does on Linux.
      # Windows has no hamlib package; take the official build and put it on
      # PATH so the spec's collector finds it exactly as it does on Linux.
      - name: Fetch hamlib ${{ env.HAMLIB_VERSION }}
        shell: pwsh
        run: |
          $url = "https://github.com/Hamlib/Hamlib/releases/download/$env:HAMLIB_VERSION/hamlib-w64-$env:HAMLIB_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile hamlib.zip
          Expand-Archive hamlib.zip -DestinationPath hamlib
          $found = Get-ChildItem -Path hamlib -Recurse -Filter rigctld.exe | Select-Object -First 1
          if (-not $found) { throw "rigctld.exe not found in the hamlib archive" }
          # libhamlib-4.dll sits beside the executables; PyInstaller's
          # analysis follows it from there.
          Write-Host "hamlib at $($found.Directory.FullName)"
          $found.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: uv run pytest -q

      - name: Build the executable
        run: uv run pyinstaller packaging/catnector.spec --noconfirm

      - name: Verify the executable ships working rig control
        run: dist/catnector.exe --check-rig

      - uses: actions/upload-artifact@v4
        with:
          name: catnector-windows
          path: dist/catnector.exe

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --wheel --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: catnector-wheel
          path: dist/*
