name: release

# Builds the downloadable artifacts. Runs on tags, and on demand so a build
# can be exercised without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04     # oldest supported glibc wins the most machines
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12

      # Bundled into the AppImage, so an operator never installs hamlib.
      - name: Install hamlib
        run: sudo apt-get update && sudo apt-get install -y libhamlib-utils

      - name: Install Qt runtime libraries
        run: sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libfuse2

      - run: uv sync --all-groups --python 3.12
      - run: uv run pytest -q

      - name: Build the bundle
        run: uv run pyinstaller packaging/catnector.spec --noconfirm

      # The point of bundling: this must pass with no hamlib on PATH.
      - name: Verify the bundle ships working rig control
        run: |
          sudo mv /usr/bin/rigctl /usr/bin/rigctl.hidden
          sudo mv /usr/bin/rigctld /usr/bin/rigctld.hidden
          QT_QPA_PLATFORM=offscreen dist/catnector/catnector --check-rig
          sudo mv /usr/bin/rigctl.hidden /usr/bin/rigctl
          sudo mv /usr/bin/rigctld.hidden /usr/bin/rigctld

      - name: Build the AppImage
        run: ./packaging/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: catnector-linux
          path: dist/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --all-groups --python 3.12

      # Windows has no hamlib package; take the official build and put it on
      # PATH so the spec's collector finds it exactly as it does on Linux.
      - name: Fetch hamlib
        shell: pwsh
        run: |
          $version = "4.6.2"
          $url = "https://github.com/Hamlib/Hamlib/releases/download/$version/hamlib-w64-$version.zip"
          Invoke-WebRequest -Uri $url -OutFile hamlib.zip
          Expand-Archive hamlib.zip -DestinationPath hamlib
          $bin = (Get-ChildItem -Path hamlib -Recurse -Filter rigctld.exe |
                  Select-Object -First 1).Directory.FullName
          if (-not $bin) { throw "rigctld.exe not found in the hamlib archive" }
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: uv run pytest -q

      - name: Build the executable
        run: uv run pyinstaller packaging/catnector.spec --noconfirm

      - name: Verify the executable ships working rig control
        run: dist/catnector.exe --check-rig

      - uses: actions/upload-artifact@v4
        with:
          name: catnector-windows
          path: dist/catnector.exe

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --wheel --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: catnector-wheel
          path: dist/*
